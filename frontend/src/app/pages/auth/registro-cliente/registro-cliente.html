<div class="container py-5">

  <div
    class="row justify-content-center">

    <div
      class="col-12 col-lg-8">

      <div class="card shadow-sm">

        <div class="card-body p-4 p-lg-5">

          <div class="mb-4">

            <h2>
              Crear cuenta
            </h2>

            <p class="text-muted mb-0">

              Regístrate para realizar
              compras por Internet.

            </p>

          </div>


          @if (error()) {

            <div class="alert alert-danger">

              {{ error() }}

            </div>

          }


          <form
            [formGroup]="form"
            (ngSubmit)="registrar()">

            <div class="row g-3">


              <div class="col-12 col-md-4">

                <label class="form-label">
                  Tipo de documento
                </label>


                <select
                  class="form-select"
                  formControlName="tipo_documento">

                  <option value="DNI">
                    DNI
                  </option>

                  <option value="CE">
                    Carné de extranjería
                  </option>

                  <option value="PASAPORTE">
                    Pasaporte
                  </option>

                </select>

              </div>


              <div class="col-12 col-md-8">

                <label class="form-label">
                  Número de documento
                </label>


                <input
                  type="text"
                  class="form-control"
                  formControlName="numero_documento">

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Nombres
                </label>


                <input
                  type="text"
                  class="form-control"
                  formControlName="nombres">

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Apellidos
                </label>


                <input
                  type="text"
                  class="form-control"
                  formControlName="apellidos">

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Correo electrónico
                </label>


                <input
                  type="email"
                  class="form-control"
                  formControlName="email">

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Teléfono
                </label>


                <input
                  type="text"
                  class="form-control"
                  formControlName="telefono">

              </div>


              <div class="col-12">

                <label class="form-label">
                  Dirección
                </label>


                <input
                  type="text"
                  class="form-control"
                  formControlName="direccion">

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Contraseña
                </label>


                <input
                  type="password"
                  class="form-control"
                  formControlName="password">


                <div class="form-text">

                  Mínimo 8 caracteres.

                </div>

              </div>


              <div class="col-12 col-md-6">

                <label class="form-label">
                  Confirmar contraseña
                </label>


                <input
                  type="password"
                  class="form-control"
                  formControlName="confirmar_password">

              </div>

            </div>


            <button
              type="submit"
              class="btn btn-success w-100 mt-4"
              [disabled]="guardando()">

              @if (guardando()) {

                Creando cuenta...

              } @else {

                Crear cuenta

              }

            </button>


            <div class="text-center mt-3">

              ¿Ya tienes una cuenta?

              <a routerLink="/login">
                Iniciar sesión
              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
