<div class="container py-5">

  <div
    class="row justify-content-center">

    <div
      class="col-12 col-md-6 col-lg-4">

      <div class="card shadow-sm">

        <div class="card-body p-4">

          <h2 class="mb-1">
            Iniciar sesión
          </h2>

          <p class="text-muted mb-4">
            Clientes AGROINPERU
          </p>


          @if (error()) {

            <div class="alert alert-danger">

              {{ error() }}

            </div>
          }


          <form
            [formGroup]="form"
            (ngSubmit)="iniciarSesion()">


            <div class="mb-3">

              <label
                class="form-label"
                for="email">

                Correo electrónico

              </label>

              <input
                id="email"
                type="email"
                class="form-control"
                formControlName="email">

            </div>


            <div class="mb-3">

              <label
                class="form-label"
                for="password">

                Contraseña

              </label>

              <input
                id="password"
                type="password"
                class="form-control"
                formControlName="password">

            </div>


            <button
              type="submit"
              class="btn btn-success w-100"
              [disabled]="cargando()">

              @if (cargando()) {

                Ingresando...

              } @else {

                Ingresar
              }

            </button>

          </form>


          <div class="text-center mt-3">

            <a routerLink="/">
              Volver al inicio
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
