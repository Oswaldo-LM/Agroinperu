<header class="sticky-top">

  <nav
    class="navbar navbar-expand-lg
           navbar-dark bg-slate-900 border-bottom-subtle">

    <div class="container">

      <a
        routerLink="/"
        class="navbar-brand fw-bold d-flex align-items-center gap-2">
        <img
          src="/AgroinPeru_logo2.png"
          alt="Logo AGROINPERU"
          width="36"
          height="36"
          class="rounded shadow-sm"
        />
        <span class="brand-text">AGROINPERU</span>
      </a>


      <button
        type="button"
        class="navbar-toggler"
        data-bs-toggle="collapse"
        data-bs-target="#navbarPublica">

        <span
          class="navbar-toggler-icon">
        </span>

      </button>


      <div
        id="navbarPublica"
        class="collapse navbar-collapse">

        <ul
          class="navbar-nav me-auto mb-2
                 mb-lg-0">

          <li class="nav-item">

            <a
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{
                exact: true
              }"
              class="nav-link d-inline-flex align-items-center gap-1">

              <i class="bi bi-house-door"></i>
              <span>Inicio</span>

            </a>

          </li>


          <li class="nav-item">

            <a
              routerLink="/catalogo"
              routerLinkActive="active"
              class="nav-link d-inline-flex align-items-center gap-1">

              <i class="bi bi-grid"></i>
              <span>Catálogo</span>

            </a>

          </li>

        </ul>


        <div
          class="d-flex align-items-center
                 gap-2">

          @if (
            authService.esCliente()
          ) {

            <a
              routerLink="/cliente/pedidos"
              class="btn btn-outline-light btn-sm d-inline-flex align-items-center gap-1">

              <i class="bi bi-box-seam"></i>
              <span>Mis pedidos</span>

            </a>


            <a
              routerLink="/cliente/cuenta"
              class="btn btn-outline-light btn-sm d-inline-flex align-items-center gap-1">

              <i class="bi bi-person-circle"></i>
              <span>Mi cuenta</span>

            </a>


            <a
              routerLink="/carrito"
              class="btn btn-success btn-sm d-inline-flex align-items-center gap-2 px-3">

              <i class="bi bi-cart3"></i>
              <span>Carrito</span>

            </a>


            <button
              type="button"
              class="btn btn-outline-danger btn-sm d-inline-flex align-items-center gap-1"
              (click)="cerrarSesion()">

              <i class="bi bi-box-arrow-right"></i>
              <span>Salir</span>

            </button>

          } @else {

            <a
              routerLink="/login"
              class="btn btn-outline-light btn-sm d-inline-flex align-items-center gap-1">

              <i class="bi bi-box-arrow-in-right"></i>
              <span>Iniciar sesión</span>

            </a>


            <a
              routerLink="/registro"
              class="btn btn-success btn-sm d-inline-flex align-items-center gap-1">

              <i class="bi bi-person-plus"></i>
              <span>Registrarse</span>

            </a>

          }

        </div>

      </div>

    </div>

  </nav>

</header>


<main>

  <router-outlet />

</main>


<footer class="footer-publico">

  <div class="container py-4">

    <div class="row g-3 align-items-center">

      <div class="col-12 col-md-6 d-flex align-items-center gap-3">

        <img
          src="/AgroinPeru_logo2.png"
          alt="Logo AGROINPERU"
          width="32"
          height="32"
          class="rounded opacity-75"
        />

        <div>
          <strong class="text-white">
            AGROINPERU S.A.C.
          </strong>

          <div class="footer-subtitle">
            Soluciones en riego tecnificado, tuberías y accesorios agrícolas e industriales.
          </div>
        </div>

      </div>


      <div
        class="col-12 col-md-6
               text-md-end">

        <small class="footer-copyright">
          © 2026 AGROINPERU S.A.C. Todos los derechos reservados.
        </small>

      </div>

    </div>

  </div>

</footer>
